[project]
name = "knowledgeforge-backend"
version = "0.1.0"
description = "KnowledgeForge FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "bcrypt<4.1",
    "celery>=5.6.3", "chromadb>=1.5.9", "confluent-kafka>=2.15.0", "email-validator>=2.0",
    "fastapi>=0.139.2", "httpx>=0.28.1", "langchain>=1.3.14", "langchain-community>=0.4.2",
    "langchain-core>=1.5.0", "langchain-openai>=1.4.0", "langgraph>=1.2.9", "neo4j>=6.2.0",
    "numpy>=2.4.6", "pdf2image>=1.17.0", "pgvector>=0.5.0", "pillow>=12.3.0",
    "prometheus-client>=0.25.0", "prometheus-fastapi-instrumentator>=8.0.2", "psycopg2-binary>=2.9.12",
    "pybreaker>=1.4.1", "pydantic>=2.13.4", "pydantic-settings>=2.14.2", "pypdf>=6.14.2",
    "pytesseract>=0.3.13", "python-docx>=1.1.0", "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0", "python-multipart>=0.0.32", "redis>=8.0.1", "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51", "structlog>=26.1.0", "tiktoken>=0.13.0", "unstructured>=0.24.1",
    "uvicorn>=0.51.0", "watchdog>=6.0.0", "passlib[bcrypt]>=1.7.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "testcontainers>=4.14.2"]
eval = [
    "huggingface-hub==1.24.0",
    "langchain-deepseek>=1.1.0",
    "ragas==0.4.3",
]

[tool.uv]
# Use the controlled mirror for image builds; callers may override with
# UV_INDEX_URL when a different trusted mirror is required.
[[tool.uv.index]]
name = "tencent-pypi"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

# Guardrails POC dependencies are intentionally maintained outside the
# production/evaluation environment because they require click<=8.2 while
# RAGAS evaluation requires click>=8.4.2.
