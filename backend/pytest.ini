[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=api --cov=agents --cov=domain --cov=services --cov=infrastructure --cov=shared --cov=workflows --cov=auth --cov=evaluation --cov-report=term-missing
